<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Document AI Assistant | RAG Demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    body { background: #0a0e14; min-height: 100vh; }
    .chat-box { max-height: 380px; overflow-y: auto; }
    .bubble-user { background: #1e3a5f; border-radius: 12px 12px 4px 12px; }
    .bubble-ai { background: #1a242e; border: 1px solid rgba(0, 229, 200, 0.25); border-radius: 12px 12px 12px 4px; }
    .accent { color: #00e5c8; }
  </style>
</head>
<body class="text-light">
  <nav class="navbar border-bottom border-secondary-subtle">
    <div class="container">
      <span class="navbar-brand mb-0 h1"><i class="bi bi-robot accent me-2"></i>Document AI Assistant</span>
      <a href="/docs" class="btn btn-outline-light btn-sm">API docs</a>
    </div>
  </nav>

  <main class="container py-4">
    <div class="row g-4">
      <div class="col-lg-4">
        <div class="card bg-dark border-secondary h-100">
          <div class="card-body">
            <h2 class="h5">1. Upload PDF</h2>
            <p class="small text-secondary">Chunks are stored in ChromaDB on this server.</p>
            <input type="file" id="pdfFile" accept=".pdf" class="form-control form-control-sm mb-2" />
            <button type="button" id="uploadBtn" class="btn btn-success w-100"><i class="bi bi-cloud-upload"></i> Upload</button>
            <div id="uploadStatus" class="small mt-2 text-secondary"></div>
            <hr />
            <div id="apiHealth" class="small font-monospace text-secondary">Checking API…</div>
          </div>
        </div>
      </div>
      <div class="col-lg-8">
        <div class="card bg-dark border-secondary">
          <div class="card-body">
            <h2 class="h5">2. Ask questions (RAG)</h2>
            <div id="chatLog" class="chat-box mb-3 p-2"></div>
            <form id="chatForm" class="d-flex gap-2">
              <input type="text" id="question" class="form-control" placeholder="Ask about your uploaded PDF…" required minlength="3" />
              <button type="submit" class="btn btn-primary px-4"><i class="bi bi-send"></i></button>
            </form>
          </div>
        </div>
      </div>
    </div>
    <p class="text-center text-secondary small mt-4">
      Portfolio project by <strong>Saswat Somya Sahu</strong> ·
      <a href="https://github.com/saswatsomyasahu/saswat" class="link-light">GitHub</a>
    </p>
  </main>

  <script>
    const log = document.getElementById("chatLog");
    const healthEl = document.getElementById("apiHealth");

    function addMsg(text, who) {
      const div = document.createElement("div");
      div.className = "mb-2 p-2 small " + (who === "user" ? "bubble-user ms-5" : "bubble-ai me-5");
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    fetch("/health")
      .then((r) => r.json())
      .then((d) => {
        healthEl.innerHTML = d.openai_configured
          ? '<span class="text-success">●</span> API OK · OpenAI configured'
          : '<span class="text-warning">●</span> API OK · Set OPENAI_API_KEY in .env for chat';
      })
      .catch(() => {
        healthEl.innerHTML = '<span class="text-danger">●</span> Cannot reach API';
      });

    document.getElementById("uploadBtn").addEventListener("click", async () => {
      const file = document.getElementById("pdfFile").files[0];
      const status = document.getElementById("uploadStatus");
      if (!file) {
        status.textContent = "Choose a PDF first.";
        return;
      }
      status.textContent = "Uploading…";
      const fd = new FormData();
      fd.append("file", file);
      try {
        const res = await fetch("/documents/upload", { method: "POST", body: fd });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || res.statusText);
        status.textContent = `Indexed ${data.chunks_indexed} chunks from ${data.filename}`;
        addMsg(`Uploaded: ${data.filename}`, "ai");
      } catch (e) {
        status.textContent = "Error: " + e.message;
      }
    });

    document.getElementById("chatForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const q = document.getElementById("question").value.trim();
      if (!q) return;
      addMsg(q, "user");
      document.getElementById("question").value = "";
      addMsg("Thinking…", "ai");
      const thinking = log.lastChild;
      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: q }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || res.statusText);
        thinking.textContent = data.answer + (data.sources?.length ? "\nSources: " + data.sources.join(", ") : "");
      } catch (err) {
        thinking.textContent = err.message;
      }
    });
  </script>
</body>
</html>
